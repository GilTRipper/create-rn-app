name: Publish Packages

# One trigger per release: the tag push. A GitHub Release is created by
# release.yml from the same tag, so listening to `release` too would publish twice.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g., v1.0.2)"
        required: true
      publish_target:
        description: "Where to publish"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - npm
          - github

jobs:
  publish_npm:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_target == 'both' || inputs.publish_target == 'npm' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC), no NPM_TOKEN

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # On workflow_dispatch github.ref is the branch it was run from,
          # so the requested tag has to win.
          ref: ${{ inputs.tag || github.ref }}

      # Node 24 ships npm >= 11.5.1, the minimum for trusted publishing.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify package.json version matches tag
        env:
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          EXPECTED_VERSION=${TAG_NAME#v}
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$EXPECTED_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "❌ Version mismatch: tag is $EXPECTED_VERSION but package.json is $PACKAGE_VERSION"
            exit 1
          fi
          echo "✅ Version matches: $PACKAGE_VERSION"

      - name: Publish to npm
        run: npm publish --access public

  publish_github_packages:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_target == 'both' || inputs.publish_target == 'github' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          scope: "@giltripper"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify package.json version matches tag
        env:
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          EXPECTED_VERSION=${TAG_NAME#v}
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$EXPECTED_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "❌ Version mismatch: tag is $EXPECTED_VERSION but package.json is $PACKAGE_VERSION"
            exit 1
          fi
          echo "✅ Version matches: $PACKAGE_VERSION"

      - name: Publish to GitHub Packages
        run: npm publish --registry https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
